name: Pull request

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: 🛠️ Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Build provider
        run: make provider

      - name: Build mbtf
        run: make mbtf

  release-config:
    name: 📦 Validate release config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      # Catches a broken .goreleaser.yml here rather than on a pushed tag,
      # where recovering means deleting and re-pushing the tag.
      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

      - name: Build a snapshot release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --snapshot --clean --single-target

  test:
    name: 🧪 Run tests (Metabase ${{ matrix.metabase_version }})
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        metabase_version:
          - v0.57.x
          - v0.58.x
          # - v0.59.x # This version has an HTTP keep alive bug that is out of our control.
          - v0.60.x
          - v0.61.x
          - v0.62.x
          - v0.63.x

    env:
      METABASE_VERSION: ${{ matrix.metabase_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Run tests
        run: make testacc-with-setup
