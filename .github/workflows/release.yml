name: Release

# Publishing to the Terraform Registry is release-driven: the Registry watches
# this repository through a webhook and ingests every GitHub release whose tag
# is a `v`-prefixed semver and whose assets are the signed set it expects
# (zips + SHA256SUMS + SHA256SUMS.sig + manifest.json). This workflow produces
# exactly that set.
#
# EVERY push to main releases: the branch-triggered run auto-tags HEAD with the
# next patch version and releases it in the same job. The tag trigger is kept
# for deliberate manual versions (e.g. a minor/major bump): pushing a tag by
# hand releases exactly that tag. The auto-tag is pushed with GITHUB_TOKEN,
# which deliberately does NOT fire a second workflow run — the release happens
# right here in this job, so there is no recursion and no PAT is needed.
on:
  push:
    branches:
      - main
    tags:
      - "v*"

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases, uploading assets and pushing the
# auto-tag as writing contents.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: 📦 Release
    runs-on: ubuntu-latest

    steps:
      - name: Check signing secrets are configured
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::Secret GPG_PRIVATE_KEY is not set. The Terraform Registry rejects unsigned releases — see RELEASING.md for how to generate the key and add it (with PASSPHRASE) to this repository's Actions secrets."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0

      # Branch builds: tag HEAD with the next patch version so goreleaser has a
      # tag to release. Tag builds skip this (the pushed tag IS the version).
      # If HEAD is already tagged (e.g. a manual tag push raced this run, or a
      # re-run), release that existing tag instead of minting a duplicate.
      - name: Auto-tag HEAD (branch builds)
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          if existing=$(git describe --exact-match --tags HEAD 2>/dev/null); then
            echo "HEAD already tagged as $existing — releasing that tag."
            exit 0
          fi
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          [ -n "$latest" ] || latest="v0.0.0"
          IFS=. read -r major minor patch <<< "${latest#v}"
          tag="v$major.$minor.$((patch + 1))"
          echo "Tagging HEAD as $tag (previous: $latest)"
          git tag "$tag"
          git push origin "$tag"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      # Check the PUBLISHED release, not dist/: the registry ingests the GitHub
      # release's assets, and goreleaser's extra_files (the manifest) are
      # uploaded under their templated name without ever existing in dist/
      # under that name — checking dist/ falsely failed the v0.14.4 run after
      # a perfectly good release.
      - name: Verify Terraform Registry assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # github.ref_name is "main" on branch builds — the released version is
          # whatever tag HEAD carries (pushed manually or by the auto-tag step).
          tag="$(git describe --exact-match --tags HEAD)"
          version="${tag#v}"
          assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for f in \
            "terraform-provider-metabase_${version}_SHA256SUMS" \
            "terraform-provider-metabase_${version}_SHA256SUMS.sig" \
            "terraform-provider-metabase_${version}_manifest.json" \
            "terraform-provider-metabase_${version}_linux_amd64.zip" \
            "terraform-provider-metabase_${version}_darwin_arm64.zip"; do
            if ! grep -qxF "$f" <<< "$assets"; then
              echo "::error::Release $tag is missing asset $f — the Terraform Registry would reject this version."
              exit 1
            fi
            echo "ok: $f"
          done
